<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="/static/js/validate.js"></script>
</head>
<body class="container mt-5">
<h2>Add Book</h2>
<form method="POST" onsubmit="return validateForm()">
  <input class="form-control mb-2" name="title" id="title" placeholder="Title">
  <input class="form-control mb-2" name="author" id="author" placeholder="Author">
  <input class="form-control mb-2" name="price" id="price" placeholder="Price">
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a>

</form>
</body>
</html>
