<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Books</h2>

    <a href="/add" class="btn btn-success mb-3">Add Book</a>

    <table class="table table-bordered">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>

        {% for b in books %}
        <tr>
            <td>{{b.title}}</td>
            <td>{{b.author}}</td>
            <td>{{b.price}}</td>

            <td>
                <a href="/edit/{{b.id}}" class="btn btn-primary btn-sm">Edit</a>
            </td>
            <td>
                <a href="/delete/{{b.id}}" class="btn btn-danger btn-sm"
                    onclick="return confirm('Are you sure to delete?')">
                    Delete
                </a>
            </td>

        </tr>
        {% endfor %}

    </table>

</body>

</html>
