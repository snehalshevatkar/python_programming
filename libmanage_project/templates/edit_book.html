<!DOCTYPE html>
<html>
<head>
  <script>
  function validateForm1(){
    let title = document.getElementById("title").value.trim();
    let price = document.getElementById("price").value;

    if(title == ""){
        alert("Title required");
        return false;
    }

    if(isNaN(price) || price==""){
        alert("Price must be number");
        return false;

        
    }

    return true;
}
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Edit Book</h2>

<form method="POST" onsubmit="return validateForm1()">
  <input class="form-control mb-2" name="title" id="title" value="{{book.title}}">
  <input class="form-control mb-2" name="author" id="author" value="{{book.author}}">
  <input class="form-control mb-2" name="price" id="price" value="{{book.price}}">
  <button class="btn btn-primary">Update</button>
  <a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a>

</form>

</body>
</html>
